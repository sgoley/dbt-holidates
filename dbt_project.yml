name: 'dbt_holidates'
version: '0.1.0'
config-version: 2
profile: 'default'
require-dbt-version: [">=1.5.0", "<3.0.0"]

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"  
clean-targets:         
    - "target"
    - "dbt_packages"
    - "dbt_modules"

vars:
    dbt_holidates_start_year: 2000
    dbt_holidates_end_year: 2035

models:
    dbt_holidates:
        +materialized: view
